<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Gastronómico - Demo Webix</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap');
    
    :root {
      --primary: #1a1a2e;
      --secondary: #16213e;
      --accent: #e94560;
      --gold: #ffd700;
      --text-light: #ffffff;
      --text-dark: #2c2c2c;
      --background: #f8f9fa;
      --card-shadow: 0 6px 24px rgba(0,0,0,0.1);
      --card-shadow-hover: 0 10px 32px rgba(0,0,0,0.15);
      --gradient: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      --gold-gradient: linear-gradient(135deg, #ffd700 0%, #ffb347 100%);
    }

    body { 
      font-family: 'Inter', sans-serif; 
      background: var(--background); 
      color: var(--text-dark);
      margin: 0;
      line-height: 1.6;
    }

    header {
      background: var(--gradient);
      color: var(--text-light);
      text-align: center;
      padding: 4rem 1rem;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    /* Sección del menú */
    .section-title {
      text-align: center;
      margin: 2.5rem 0 1rem;
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: var(--primary);
    }

    .category-filters {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 2rem;
    }

    .category-filters button {
      padding: 10px 20px;
      border-radius: 25px;
      border: 2px solid var(--primary);
      background: transparent;
      color: var(--primary);
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .category-filters button.active,
    .category-filters button:hover {
      background: var(--gradient);
      color: var(--text-light);
      transform: translateY(-2px);
    }

    /* --- Vista tipo lista --- */
    .product-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding: 0 1rem 4rem;
      max-width: 900px;
      margin: 0 auto;
    }

    .product-item {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      background: white;
      border-radius: 16px;
      box-shadow: var(--card-shadow);
      padding: 1rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .product-item:hover {
      transform: scale(1.01);
      box-shadow: var(--card-shadow-hover);
    }

    .product-item img {
      width: 120px;
      height: 120px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .product-details {
      flex: 1;
    }

    .product-details h3 {
      font-family: 'Playfair Display', serif;
      margin: 0 0 0.3rem;
      font-size: 1.2rem;
      color: var(--primary);
    }

    .product-details p.desc {
      color: #555;
      font-size: 0.95rem;
      margin: 0 0 0.5rem;
    }

    .product-price {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent);
    }

    .product-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .product-controls button {
      padding: 6px 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s ease;
      font-size: 1rem;
    }

    .btn-minus {
      background: #ffc107;
      color: black;
    }

    .btn-plus {
      background: #28a745;
      color: white;
    }

    .btn-minus:hover { background: #ffb300; }
    .btn-plus:hover { background: #218838; }

    .product-controls span {
      min-width: 20px;
      text-align: center;
      font-weight: 600;
    }

    /* Botón flotante del carrito */
    .cart-float { 
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--gradient);
      color: var(--text-light);
      padding: 14px 22px;
      border-radius: 40px;
      font-weight: 600;
      box-shadow: var(--card-shadow);
      cursor: pointer;
      z-index: 100;
      transition: all 0.3s ease;
    }

    .cart-float:hover {
      transform: scale(1.05);
      box-shadow: var(--card-shadow-hover);
    }

    /* Modal Carrito */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(26,26,46,0.8);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 200;
    }

    .modal-content {
      background: white;
      padding: 1.5rem;
      border-radius: 20px;
      width: 90%;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
      position: relative;
    }

    .modal-content h2 {
      text-align: center;
      color: var(--primary);
      font-family: 'Playfair Display', serif;
    }

    .close-modal {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      cursor: pointer;
      font-size: 16px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 0;
      padding: 10px;
      background: #f8f9fa;
      border-radius: 10px;
    }

    .cart-item-controls {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .cart-item-controls button {
      border: none;
      border-radius: 6px;
      padding: 5px 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .whatsapp-button, .clear-cart-button {
      width: 100%;
      margin-top: 1rem;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
    }

    .whatsapp-button {
      background: #25D366;
      color: white;
    }

    .clear-cart-button {
      background: var(--accent);
      color: white;
    }

    @media (max-width: 600px) {
      .product-item {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .product-item img {
        width: 100%;
        height: 180px;
      }

      .product-controls {
        justify-content: center;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>Demo Webix</h1>
  <p>Experiencia culinaria excepcional con los mejores sabores artesanales</p>
</header>

<section>
  <h2 class="section-title">Nuestro Menú</h2>

  <div class="category-filters">
    <button class="active" onclick="filterProducts('all', this)">Todos</button>
    <button onclick="filterProducts('pizzas', this)">Pizzas</button>
    <button onclick="filterProducts('hamburguesas', this)">Hamburguesas</button>
    <button onclick="filterProducts('bebidas', this)">Bebidas</button>
    <button onclick="filterProducts('postres', this)">Postres</button>
  </div>

  <div id="productList" class="product-list"></div>
</section>

<div class="cart-float" onclick="toggleCart()">🛒 $<span id="cartTotal">0</span></div>

<div class="modal" id="cartModal">
  <div class="modal-content">
    <button class="close-modal" onclick="toggleCart()">✖</button>
    <h2>Tu Pedido</h2>
    <div id="cartItems"></div>
    <p style="text-align:center;font-weight:600;font-size:1.2rem;">
      Total: $<span id="modalTotal">0</span>
    </p>
    <button class="clear-cart-button" onclick="clearCart()">🗑️ Vaciar carrito</button>
    <button class="whatsapp-button" onclick="sendWhatsApp()">📱 Confirmar pedido</button>
  </div>
</div>

<script>
const products = [
  { id: 1, name: "Pizza Margherita Artesanal", price: 5500, category: "pizzas", 
    images: ["https://images.unsplash.com/photo-1604382354936-07c5d9983bd3?w=400&h=300&fit=crop"], 
    description: "Pizza artesanal con salsa de tomate casera, mozzarella di bufala y albahaca fresca." },
  { id: 2, name: "Pizza Quattro Formaggi", price: 6200, category: "pizzas", 
    images: ["https://images.unsplash.com/photo-1593560708920-61dd98c46a4e?w=400&h=300&fit=crop"], 
    description: "Combinación de cuatro quesos: mozzarella, gorgonzola, parmesano y provolone." },
  { id: 3, name: "Burger Gourmet Clásica", price: 5200, category: "hamburguesas", 
    images: ["https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400&h=300&fit=crop"], 
    description: "Medallón de carne Angus 200g, cheddar, lechuga, tomate y papas rústicas." },
  { id: 4, name: "Coca Cola 500ml", price: 1200, category: "bebidas", 
    images: ["https://images.unsplash.com/photo-1581636625402-29b2a704ef13?w=400&h=300&fit=crop"], 
    description: "Refrescante Coca Cola original en botella de vidrio de 500ml." },
  { id: 5, name: "Tiramisu Artesanal", price: 2800, category: "postres", 
    images: ["https://images.unsplash.com/photo-1571877227200-a0d98ea607e9?w=400&h=300&fit=crop"], 
    description: "Clásico tiramisú italiano con café espresso, mascarpone y cacao amargo." },
];

let cart = [];
let selectedCategory = 'all';

function renderProducts() {
  const container = document.getElementById('productList');
  container.innerHTML = '';
  const filtered = selectedCategory === 'all' ? products : products.filter(p => p.category === selectedCategory);

  filtered.forEach(p => {
    const quantity = cart.find(i => i.id === p.id)?.quantity || 0;
    const div = document.createElement('div');
    div.className = 'product-item';
    div.innerHTML = `
      <img src="${p.images[0]}" alt="${p.name}">
      <div class="product-details">
        <h3>${p.name}</h3>
        <p class="desc">${p.description}</p>
        <div class="product-price">$${p.price}</div>
        <div class="product-controls">
          <button class="btn-minus" onclick="changeQuantity(${p.id}, -1)">−</button>
          <span>${quantity}</span>
          <button class="btn-plus" onclick="addToCart(${p.id})">+</button>
        </div>
      </div>
    `;
    container.appendChild(div);
  });
}

function filterProducts(cat, btn) {
  selectedCategory = cat;
  document.querySelectorAll('.category-filters button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderProducts();
}

function toggleCart() {
  const modal = document.getElementById('cartModal');
  modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
  renderCart();
}

function addToCart(id) {
  const product = products.find(p => p.id === id);
  const existing = cart.find(i => i.id === id);
  if (existing) existing.quantity++;
  else cart.push({...product, quantity: 1});
  updateTotals();
  renderProducts();
}

function changeQuantity(id, delta) {
  const item = cart.find(i => i.id === id);
  if (!item) return;
  item.quantity += delta;
  if (item.quantity <= 0) cart = cart.filter(i => i.id !== id);
  updateTotals();
  renderProducts();
}

function clearCart() {
  cart = [];
  updateTotals();
  renderCart();
  renderProducts();
}

function renderCart() {
  const container = document.getElementById('cartItems');
  container.innerHTML = '';
  cart.forEach(item => {
    const div = document.createElement('div');
    div.className = 'cart-item';
    div.innerHTML = `
      <div>${item.name} <br> $${item.price} x ${item.quantity}</div>
      <div class="cart-item-controls">
        <button onclick="changeQuantity(${item.id}, -1)">−</button>
        <button onclick="changeQuantity(${item.id}, 1)">+</button>
      </div>
    `;
    container.appendChild(div);
  });
}

function updateTotals() {
  const total = cart.reduce((sum, i) => sum + i.price * i.quantity, 0);
  document.getElementById('cartTotal').innerText = total;
  document.getElementById('modalTotal').innerText = total;
  renderCart();
}

// Opciones de entrega
  function toggleAddress() {
    const deliveryOption = document.querySelector('input[name="deliveryOption"]:checked').value;
    document.getElementById('addressField').style.display = deliveryOption === 'envio' ? 'block' : 'none';
  }

  // WhatsApp
 function sendWhatsApp() {
  if (cart.length === 0) {
    alert('Tu carrito está vacío.');
    return;
  }

  const deliveryOption = document.querySelector('input[name="deliveryOption"]:checked').value;
  let addressText = '';

  if (deliveryOption === 'envio') {
    const name = document.getElementById('customerName').value.trim();
    const address = document.getElementById('customerAddress').value.trim();
    const streets = document.getElementById('customerStreets').value.trim();
    const phone = document.getElementById('customerPhone').value.trim();
    const payment = document.getElementById('customerPayment').value.trim();

    if (!name || !address || !streets || !phone || !payment) {
      alert('Por favor, completa todos los campos de envío antes de confirmar el pedido.');
      return;
    }

    addressText = 
      `\n\n *Datos de envío:*` +
      `\n Nombre: ${name}` +
      `\n Dirección: ${address}` +
      `\n Entre calles: ${streets}` +
      `\n Teléfono: ${phone}` +
      `\n Método de pago: ${payment}`;
  }

  let message = ' *Nuevo pedido desde la web:*\n\n';
  cart.forEach(item => {
    message += `${item.quantity} x ${item.name} - $${item.price * item.quantity}\n`;
  });
  message += `\n *Total:* $${cart.reduce((sum, i) => sum + i.price * i.quantity, 0)}`;
  message += `\n *Opción:* ${deliveryOption === 'retiro' ? 'Retiro por local' : 'Envío a domicilio'}${addressText}`;

  const encodedMessage = encodeURIComponent(message);
  window.open(`https://wa.me/5493541294944?text=${encodedMessage}`, '_blank');
}

  // Inicialización
  renderProducts();
</script>

</body>
</html>
